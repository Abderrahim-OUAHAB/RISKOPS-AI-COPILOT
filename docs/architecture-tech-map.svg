<svg width="1400" height="980" viewBox="0 0 1400 980" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #f8fafc; }
    .title { font: 700 34px Arial, sans-serif; fill: #0f172a; }
    .subtitle { font: 400 17px Arial, sans-serif; fill: #475569; }
    .section { font: 700 18px Arial, sans-serif; fill: #0f172a; }
    .label { font: 700 17px Arial, sans-serif; fill: #0f172a; }
    .small { font: 400 13px Arial, sans-serif; fill: #475569; }
    .tiny { font: 400 12px Arial, sans-serif; fill: #64748b; }
    .box { fill: white; stroke: #cbd5e1; stroke-width: 1.5; rx: 18; }
    .module { fill: white; stroke: #94a3b8; stroke-width: 1.5; rx: 14; }
    .arrow { stroke: #334155; stroke-width: 2.2; fill: none; marker-end: url(#arrowhead); }
    .arrow-soft { stroke: #64748b; stroke-width: 1.8; fill: none; marker-end: url(#arrowhead-soft); stroke-dasharray: 7 7; }
    .badge-text { font: 700 16px Arial, sans-serif; fill: white; }
    .badge-small { font: 700 12px Arial, sans-serif; fill: white; }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#334155"/>
    </marker>
    <marker id="arrowhead-soft" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect class="bg" width="1400" height="980"/>

  <text x="70" y="70" class="title">AI RiskOps Copilot - Architecture technique</text>
  <text x="70" y="102" class="subtitle">Interaction entre frontend, backend, données, RAG, machine learning, agent IA, monitoring et déploiement</text>

  <rect x="70" y="140" width="1260" height="780" class="box" filter="url(#shadow)"/>

  <!-- User Layer -->
  <rect x="110" y="190" width="190" height="120" class="module"/>
  <circle cx="145" cy="225" r="23" fill="#0f172a"/>
  <text x="136" y="231" class="badge-text">U</text>
  <text x="180" y="222" class="label">Utilisateur</text>
  <text x="180" y="246" class="small">Manager business</text>
  <text x="180" y="268" class="tiny">questions, uploads, décisions</text>

  <!-- Frontend -->
  <rect x="380" y="180" width="230" height="140" class="module"/>
  <rect x="405" y="205" width="50" height="50" rx="12" fill="#ff4b4b"/>
  <text x="415" y="236" class="badge-text">ST</text>
  <text x="475" y="215" class="label">Streamlit</text>
  <text x="475" y="241" class="small">Dashboard MVP</text>
  <text x="405" y="280" class="tiny">Upload PDF/CSV</text>
  <text x="405" y="300" class="tiny">Questions et Risk Score</text>

  <!-- Backend -->
  <rect x="690" y="180" width="250" height="140" class="module"/>
  <rect x="715" y="205" width="50" height="50" rx="12" fill="#05998b"/>
  <text x="725" y="236" class="badge-text">API</text>
  <text x="785" y="215" class="label">FastAPI</text>
  <text x="785" y="241" class="small">Backend central</text>
  <text x="715" y="280" class="tiny">Endpoints upload, RAG, ML</text>
  <text x="715" y="300" class="tiny">Orchestration des services</text>

  <!-- Database -->
  <rect x="1030" y="180" width="250" height="140" class="module"/>
  <rect x="1055" y="205" width="50" height="50" rx="12" fill="#336791"/>
  <text x="1065" y="236" class="badge-text">PG</text>
  <text x="1125" y="215" class="label">PostgreSQL</text>
  <text x="1125" y="241" class="small">Données métier</text>
  <text x="1055" y="280" class="tiny">clients, documents, scores</text>
  <text x="1055" y="300" class="tiny">métadonnées et feedback</text>

  <!-- pgvector -->
  <rect x="1030" y="370" width="250" height="120" class="module"/>
  <rect x="1055" y="395" width="50" height="50" rx="12" fill="#4f46e5"/>
  <text x="1060" y="426" class="badge-small">VEC</text>
  <text x="1125" y="410" class="label">pgvector</text>
  <text x="1125" y="436" class="small">Recherche sémantique</text>
  <text x="1055" y="466" class="tiny">embeddings des chunks</text>

  <!-- RAG -->
  <rect x="690" y="370" width="250" height="140" class="module"/>
  <rect x="715" y="395" width="50" height="50" rx="12" fill="#7c3aed"/>
  <text x="719" y="426" class="badge-small">RAG</text>
  <text x="785" y="405" class="label">LlamaIndex</text>
  <text x="785" y="431" class="small">RAG avec sources</text>
  <text x="715" y="470" class="tiny">chunking, retrieval, citations</text>
  <text x="715" y="490" class="tiny">réponses contextualisées</text>

  <!-- LLM -->
  <rect x="380" y="370" width="230" height="140" class="module"/>
  <rect x="405" y="395" width="50" height="50" rx="12" fill="#111827"/>
  <text x="414" y="426" class="badge-text">AI</text>
  <text x="475" y="405" class="label">OpenAI API</text>
  <text x="475" y="431" class="small">Modèle génératif</text>
  <text x="405" y="470" class="tiny">réponses, synthèse, analyse</text>
  <text x="405" y="490" class="tiny">sera remplaçable par Mistral</text>

  <!-- Documents -->
  <rect x="110" y="370" width="190" height="140" class="module"/>
  <rect x="135" y="395" width="50" height="50" rx="12" fill="#f97316"/>
  <text x="143" y="426" class="badge-text">PDF</text>
  <text x="195" y="405" class="label">Documents</text>
  <text x="195" y="431" class="small">PDF et CSV</text>
  <text x="135" y="470" class="tiny">contrats, factures</text>
  <text x="135" y="490" class="tiny">tickets, clients</text>

  <!-- ML -->
  <rect x="380" y="580" width="230" height="150" class="module"/>
  <rect x="405" y="605" width="50" height="50" rx="12" fill="#f59e0b"/>
  <text x="407" y="636" class="badge-small">XGB</text>
  <text x="475" y="615" class="label">XGBoost</text>
  <text x="475" y="641" class="small">Churn prediction</text>
  <text x="405" y="680" class="tiny">risque client</text>
  <text x="405" y="700" class="tiny">features tabulaires</text>

  <!-- MLflow -->
  <rect x="110" y="580" width="190" height="150" class="module"/>
  <rect x="135" y="605" width="50" height="50" rx="12" fill="#0194e2"/>
  <text x="141" y="636" class="badge-small">MLF</text>
  <text x="195" y="615" class="label">MLflow</text>
  <text x="195" y="641" class="small">MLOps</text>
  <text x="135" y="680" class="tiny">métriques, modèles</text>
  <text x="135" y="700" class="tiny">expériences</text>

  <!-- Agent -->
  <rect x="690" y="580" width="250" height="150" class="module"/>
  <rect x="715" y="605" width="50" height="50" rx="12" fill="#10b981"/>
  <text x="720" y="636" class="badge-small">LG</text>
  <text x="785" y="615" class="label">LangGraph</text>
  <text x="785" y="641" class="small">Agent contrôlé</text>
  <text x="715" y="680" class="tiny">choisit RAG, SQL ou ML</text>
  <text x="715" y="700" class="tiny">génère actions business</text>

  <!-- Monitoring -->
  <rect x="1030" y="580" width="250" height="150" class="module"/>
  <rect x="1055" y="605" width="50" height="50" rx="12" fill="#dc2626"/>
  <text x="1063" y="636" class="badge-small">OBS</text>
  <text x="1125" y="615" class="label">Monitoring</text>
  <text x="1125" y="641" class="small">Langfuse + Evidently</text>
  <text x="1055" y="680" class="tiny">qualité LLM, drift ML</text>
  <text x="1055" y="700" class="tiny">feedback et latence</text>

  <!-- DevOps -->
  <rect x="380" y="790" width="230" height="90" class="module"/>
  <rect x="405" y="812" width="45" height="45" rx="10" fill="#1d63ed"/>
  <text x="411" y="840" class="badge-small">DK</text>
  <text x="470" y="822" class="label">Docker</text>
  <text x="470" y="848" class="small">Exécution locale</text>

  <rect x="690" y="790" width="250" height="90" class="module"/>
  <rect x="715" y="812" width="45" height="45" rx="10" fill="#24292f"/>
  <text x="722" y="840" class="badge-small">GH</text>
  <text x="775" y="822" class="label">GitHub Actions</text>
  <text x="775" y="848" class="small">CI/CD future version</text>

  <rect x="1030" y="790" width="250" height="90" class="module"/>
  <rect x="1055" y="812" width="45" height="45" rx="10" fill="#ff9900"/>
  <text x="1063" y="840" class="badge-small">AWS</text>
  <text x="1115" y="822" class="label">AWS</text>
  <text x="1115" y="848" class="small">Déploiement cloud</text>

  <!-- Arrows main flow -->
  <path class="arrow" d="M300 250 C330 250 350 250 380 250"/>
  <path class="arrow" d="M610 250 C640 250 660 250 690 250"/>
  <path class="arrow" d="M940 250 C970 250 1000 250 1030 250"/>
  <path class="arrow" d="M815 320 C815 340 815 350 815 370"/>
  <path class="arrow" d="M940 430 C970 430 1000 430 1030 430"/>
  <path class="arrow" d="M690 430 C660 430 640 430 610 430"/>
  <path class="arrow" d="M300 440 C330 440 350 440 380 440"/>
  <path class="arrow" d="M505 510 C505 540 505 550 505 580"/>
  <path class="arrow" d="M610 655 C640 655 660 655 690 655"/>
  <path class="arrow" d="M940 655 C970 655 1000 655 1030 655"/>
  <path class="arrow" d="M815 730 C815 755 815 765 815 790"/>

  <!-- Soft arrows -->
  <path class="arrow-soft" d="M380 655 C340 655 330 655 300 655"/>
  <path class="arrow-soft" d="M1155 580 C1155 545 1155 525 1155 490"/>
  <path class="arrow-soft" d="M1155 320 C1155 340 1155 350 1155 370"/>
  <path class="arrow-soft" d="M940 835 C970 835 1000 835 1030 835"/>
  <path class="arrow-soft" d="M610 835 C640 835 660 835 690 835"/>

  <!-- Footer legend -->
  <text x="110" y="930" class="small">Flux principal: utilisateur -> interface -> API -> données -> RAG/ML/agent -> monitoring.</text>
  <text x="110" y="952" class="tiny">Les badges représentent les technologies utilisées. Le MVP démarre avec Streamlit, FastAPI, PostgreSQL, pgvector et Docker.</text>
</svg>

