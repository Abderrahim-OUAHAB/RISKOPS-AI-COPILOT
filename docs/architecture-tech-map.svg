<svg width="1400" height="900" viewBox="0 0 1400 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #f8fafc; }
    .title { font: 700 34px Arial, sans-serif; fill: #0f172a; }
    .sub { font: 400 16px Arial, sans-serif; fill: #475569; }
    .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 12; }
    .head { font: 700 17px Arial, sans-serif; fill: #0f172a; }
    .txt { font: 400 13px Arial, sans-serif; fill: #475569; }
    .arrow { stroke: #334155; stroke-width: 2; marker-end: url(#arrow); fill: none; }
    .dash { stroke: #64748b; stroke-width: 2; marker-end: url(#arrow2); fill: none; stroke-dasharray: 6 6; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#334155"/>
    </marker>
    <marker id="arrow2" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect class="bg" width="1400" height="900"/>
  <text x="60" y="65" class="title">AI RiskOps Copilot - Final Portfolio Architecture</text>
  <text x="60" y="95" class="sub">Full-stack AI product with RAG, ML, agent routing, data pipelines and monitoring</text>

  <rect x="60" y="145" width="190" height="90" class="box"/>
  <text x="85" y="180" class="head">Business User</text>
  <text x="85" y="205" class="txt">Risk questions</text>
  <text x="85" y="225" class="txt">PDF/CSV uploads</text>

  <rect x="320" y="145" width="210" height="90" class="box"/>
  <text x="345" y="180" class="head">Streamlit Dashboard</text>
  <text x="345" y="205" class="txt">Demo UX</text>
  <text x="345" y="225" class="txt">Monitoring tab</text>

  <rect x="610" y="145" width="220" height="90" class="box"/>
  <text x="635" y="180" class="head">FastAPI Backend</text>
  <text x="635" y="205" class="txt">Documents, RAG, risk</text>
  <text x="635" y="225" class="txt">Agent and monitoring APIs</text>

  <rect x="910" y="145" width="220" height="90" class="box"/>
  <text x="935" y="180" class="head">PostgreSQL</text>
  <text x="935" y="205" class="txt">Customers, documents</text>
  <text x="935" y="225" class="txt">Predictions, metadata</text>

  <rect x="1170" y="145" width="170" height="90" class="box"/>
  <text x="1195" y="180" class="head">pgvector</text>
  <text x="1195" y="205" class="txt">Embeddings</text>
  <text x="1195" y="225" class="txt">Similarity search</text>

  <path d="M250 190 H320" class="arrow"/>
  <path d="M530 190 H610" class="arrow"/>
  <path d="M830 190 H910" class="arrow"/>
  <path d="M1130 190 H1170" class="arrow"/>

  <rect x="120" y="330" width="230" height="120" class="box"/>
  <text x="145" y="365" class="head">Document Pipeline</text>
  <text x="145" y="390" class="txt">PDF/CSV upload</text>
  <text x="145" y="410" class="txt">Extraction and chunking</text>
  <text x="145" y="430" class="txt">Stored in data/raw</text>

  <rect x="430" y="330" width="230" height="120" class="box"/>
  <text x="455" y="365" class="head">RAG</text>
  <text x="455" y="390" class="txt">OpenAI API optional</text>
  <text x="455" y="410" class="txt">Embeddings</text>
  <text x="455" y="430" class="txt">Answers with sources</text>

  <rect x="740" y="330" width="230" height="120" class="box"/>
  <text x="765" y="365" class="head">Machine Learning</text>
  <text x="765" y="390" class="txt">XGBoost churn model</text>
  <text x="765" y="410" class="txt">Risk score</text>
  <text x="765" y="430" class="txt">MLflow local tracking</text>

  <rect x="1050" y="330" width="230" height="120" class="box"/>
  <text x="1075" y="365" class="head">LangGraph Agent</text>
  <text x="1075" y="390" class="txt">Controlled routing</text>
  <text x="1075" y="410" class="txt">Priority customers</text>
  <text x="1075" y="430" class="txt">Weekly report or RAG</text>

  <path d="M720 235 L235 330" class="dash"/>
  <path d="M720 235 L545 330" class="dash"/>
  <path d="M720 235 L855 330" class="dash"/>
  <path d="M720 235 L1165 330" class="dash"/>

  <rect x="170" y="560" width="260" height="120" class="box"/>
  <text x="195" y="595" class="head">Airflow</text>
  <text x="195" y="620" class="txt">riskops_daily_pipeline</text>
  <text x="195" y="640" class="txt">Import, dbt, train, report</text>

  <rect x="500" y="560" width="230" height="120" class="box"/>
  <text x="525" y="595" class="head">dbt</text>
  <text x="525" y="620" class="txt">Staging</text>
  <text x="525" y="640" class="txt">Intermediate and mart models</text>

  <rect x="800" y="560" width="250" height="120" class="box"/>
  <text x="825" y="595" class="head">Monitoring</text>
  <text x="825" y="620" class="txt">Evidently-style HTML report</text>
  <text x="825" y="640" class="txt">monitoring/logs JSONL traces</text>
  <text x="825" y="660" class="txt">Langfuse optional</text>

  <rect x="1120" y="560" width="210" height="120" class="box"/>
  <text x="1145" y="595" class="head">GitHub Actions</text>
  <text x="1145" y="620" class="txt">Install dependencies</text>
  <text x="1145" y="640" class="txt">Compile Python</text>
  <text x="1145" y="660" class="txt">Validate Compose</text>

  <path d="M300 560 L300 450" class="arrow"/>
  <path d="M430 620 H500" class="arrow"/>
  <path d="M730 620 H800" class="arrow"/>
  <path d="M970 450 L925 560" class="dash"/>
  <path d="M1050 620 H1120" class="dash"/>

  <rect x="170" y="760" width="1010" height="70" class="box"/>
  <text x="195" y="792" class="head">Docker Compose Services</text>
  <text x="195" y="818" class="txt">postgres | backend | frontend | airflow-webserver | airflow-scheduler</text>
</svg>

