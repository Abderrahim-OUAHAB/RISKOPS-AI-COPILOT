name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    name: Validate Python, Compose and Repository Hygiene
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ""
      ENABLE_LANGFUSE: "false"
      DATABASE_URL: "postgresql+psycopg://riskops:riskops@localhost:5432/riskops"
      BACKEND_CORS_ORIGINS: "http://localhost:8501,http://127.0.0.1:8501"
      MAX_UPLOAD_SIZE_MB: "10"
      RATE_LIMIT_PER_MINUTE: "60"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            frontend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Install frontend dependencies
        run: pip install -r frontend/requirements.txt

      - name: Compile backend and frontend
        run: |
          python -m compileall \
            backend/app \
            frontend/app.py \
            frontend/components.py \
            frontend/api_client.py \
            frontend/translations.py

      - name: Minimal import checks
        run: |
          PYTHONPATH=backend python - <<'PY'
          import app.main
          print("backend import OK")
          PY
          PYTHONPATH=frontend python - <<'PY'
          import api_client
          import components
          import translations
          print("frontend imports OK")
          PY

      - name: Validate Docker Compose
        run: docker compose config

      - name: Check sensitive files are not tracked
        shell: bash
        run: |
          set -euo pipefail
          tracked_sensitive="$(
            git ls-files \
              | grep -E '(^|/)\.env$|^mlruns/|^monitoring/logs/|^monitoring/reports/|^data/raw/|^data/processed/|__pycache__|\.pyc$|^\.pytest_cache/' \
              | grep -v -E '^(data/raw|data/processed|monitoring/logs|monitoring/reports)/\.gitkeep$' \
              || true
          )"
          if [ -n "$tracked_sensitive" ]; then
            echo "Sensitive or generated files are tracked:"
            echo "$tracked_sensitive"
            exit 1
          fi
          if git ls-files | grep -qx ".env"; then
            echo ".env must never be tracked"
            exit 1
          fi
          if git grep -nE 'sk-[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{20,}' -- ':!docs/screenshots/*'; then
            echo "Potential hardcoded secret found"
            exit 1
          fi

      - name: Check portfolio and deployment docs
        run: |
          test -f README.md
          test -f docs/deployment.md
          test -f docs/portfolio-case-study.md
          test -f docs/interview-pitch.md
          test -f docs/interview-qa.md
          test -f docs/demo-script.md
          test -f docs/architecture-final.md
          test -f .env.example
          test -f .env.production.example
